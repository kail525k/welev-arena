<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>UNFINISHED WAR · 언피니시드 워 — 1막 작전명 북악</title>
<meta name="description" content="끝나지 않은 전쟁. 1968년 1·21 청와대 기습을 막아라 — 분대를 지휘하며 사방에서 몰려오는 침투조를 막는 쿼터뷰 로그라이트 방어전.">
<meta property="og:title" content="UNFINISHED WAR · 언피니시드 워">
<meta property="og:description" content="끝나지 않은 전쟁 · 1막 작전명 북악 — 청와대를 지켜라. PC 크롬에서 바로 플레이.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://unfinished-war.vercel.app/img/img_keyart.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE a tense winter-night special-forces campaign mission, cinematic like an early Call of Duty level
   IDEA the squad's tactical overhead feed: radar, radio subtitles, objective checklist, raid-style boss bar
   PICTURE the live 3D quarter-view battlefield of Jahamun pass down to the Blue House fills the screen
   COLOUR night navy #0b1020, snow ink #eef3ff, danger red #ff4b3a, objective yellow #ffd24a, counter blue #4fb6ff, squad green #5fe08a
   TYPE Black Han Sans for titles, Noto Sans KR for text, Rajdhani for numbers
   LAYOUT full-screen canvas; objectives+squad left, radar+kill feed right, boss bar top centre, radio bottom-left, HP+skills bottom centre */
:root{color-scheme:dark}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;background:#0b1020;color:#eef3ff;font:16px/1.5 'Noto Sans KR',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;user-select:none;-webkit-user-select:none}
#c,#edge{position:absolute;inset:0;width:100%;height:100%;display:block}
#c{cursor:crosshair}
#edge{pointer-events:none}
#labels,#nums{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ehp{position:absolute;width:40px;height:5px;margin-left:-20px;background:#1a0b0b;border:1px solid #000;border-radius:2px;overflow:hidden}
.ehp i{display:block;height:100%;background:#ff4b3a}
.ehp.big{width:70px;margin-left:-35px;height:7px}
.ehp.sm{width:30px;margin-left:-15px;height:4px}
.ehp.big i{background:#ff9a3a}
.nm{position:absolute;transform:translate(-50%,-100%);font:700 12px/1 'Noto Sans KR';color:#9fe8b8;text-shadow:0 1px 2px #000;white-space:nowrap}
.nm.civ{color:#ffd24a}
.dn{position:absolute;transform:translate(-50%,-50%);font:700 19px/1 'Rajdhani',sans-serif;color:#fff;text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.8);white-space:nowrap;animation:up .8s ease-out forwards}
.dn.crit{color:#ffc94a;font-size:26px}
.dn.hurt{color:#ff6a5a}
.dn.heal{color:#5fe08a}
.dn.tag{font:400 21px/1 'Black Han Sans';color:#4fb6ff}
.dn.tag.gold{color:#ffc94a}
@keyframes up{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
#hud{position:absolute;inset:0;pointer-events:none}
#hud[hidden]{display:none}
#left{position:absolute;left:14px;top:12px;width:300px;display:grid;gap:8px}
#obj{padding:10px 12px;border-radius:10px;background:rgba(5,8,18,.66);border-left:3px solid #ffd24a}
#obj .act{font:600 12px 'Noto Sans KR';color:#9aa6c6}
#objTitle{display:block;font:400 21px/1.2 'Black Han Sans';color:#ffd24a;text-shadow:0 2px 4px #000}
#objList{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px}
#objList li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
#objList li b{font:700 15px 'Rajdhani';white-space:nowrap}
#objList li.ok{color:#9fe8b8}
#objList li.bad b{color:#ff6a5a}
#kia{line-height:1.6;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#cdd6ee}
#kia b{font:700 16px 'Rajdhani';color:#fff}
#gateMini{margin-top:4px;height:6px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden}
#gateMini i{display:block;height:100%;background:linear-gradient(90deg,#2f7fd6,#7cc8ff)}
#squad{display:grid;gap:5px}
.sq{display:grid;grid-template-columns:30px 1fr auto;gap:2px 8px;align-items:center;padding:5px 8px;border-radius:8px;background:rgba(5,8,18,.6)}
.sq .av{grid-row:1/3;width:30px;height:30px;border-radius:6px;background:#0a0d14 var(--face) no-repeat;background-size:200% 200%}
.sq b{font-size:13px}
.sq span{font-size:11px;color:#9aa6c6}
.sq .bar{grid-column:2/-1;height:6px}
.sq .bar i{background:#5fe08a}
.sq.down{opacity:.55}
.sq.down .bar i{background:#ff4b3a}
.bar{position:relative;height:12px;border-radius:6px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;transition:width .15s}
#right{position:absolute;right:14px;top:12px;width:210px;display:grid;gap:6px;justify-items:end}
#radarWrap{position:relative;width:206px;height:206px;border-radius:50%;padding:3px;background:rgba(5,8,18,.7);box-shadow:0 0 0 1px rgba(143,179,255,.35),0 6px 18px rgba(0,0,0,.5)}
#radar{width:200px;height:200px;display:block;border-radius:50%}
#radarTxt{font:600 13px 'Noto Sans KR';color:#cdd6ee;text-shadow:0 1px 2px #000;text-align:right}
#radarTxt b{font:700 16px 'Rajdhani';color:#ff7a62}
#feed{display:grid;gap:3px;justify-items:end}
#feed div{padding:3px 8px;border-radius:6px;background:rgba(5,8,18,.6);font-size:12px;white-space:nowrap;animation:fd 4.5s forwards}
#feed div.gold{color:#ffc94a}
#feed div.bad{color:#ff8a7a}
#feed div.good{color:#9fe8b8}
@keyframes fd{0%{opacity:0;transform:translateX(10px)}6%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#radio{position:absolute;left:14px;bottom:22px;width:min(500px,36vw);padding:10px 14px;display:grid;grid-template-columns:58px 1fr;gap:0 12px;align-items:center;border-radius:10px;background:rgba(5,8,18,.78);border-left:3px solid #8fc6ff;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
#radio.show{opacity:1;transform:none}
#rWho{display:block;font:700 13px 'Noto Sans KR';color:#8fc6ff;grid-column:2}
#rFace{grid-row:1/3;width:58px;height:58px;border-radius:8px;background:#0a0d14 var(--face) no-repeat;background-size:200% 200%;box-shadow:0 0 0 1px rgba(143,198,255,.45)}
#radio.noface{grid-template-columns:1fr}
#radio.noface #rFace{display:none}
#radio.noface #rWho,#radio.noface #rTxt{grid-column:1}
#rTxt{display:block;font-size:15px;line-height:1.45;grid-column:2}
#banner{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);font:400 clamp(26px,3.4vw,42px)/1.1 'Black Han Sans';color:#fff;text-shadow:0 3px 10px #000;padding:10px 26px;opacity:0;transition:opacity .4s;white-space:nowrap;text-align:center}
#banner small{display:block;font:600 15px 'Noto Sans KR';color:#ffd9a8;margin-top:6px}
#banner.show{opacity:1}
#boss{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(560px,44vw);text-align:center}
#boss[hidden]{display:none}
#bossName{font:400 20px/1.2 'Black Han Sans';color:#ffb0a6;text-shadow:0 2px 4px #000}
#bossLines{float:right;font:700 18px/1 'Rajdhani';color:#ffd0c8;margin-top:2px}
#bossBar{height:18px;margin-top:4px}
#bossBar em{position:absolute;inset:0;background:var(--under,#5c1a14)}
#stag{margin:6px auto 0;width:80%}
#stag[hidden]{display:none}
#stag .bar i{background:linear-gradient(#ffe08a,#d8a23a)}
#stagLbl{font:600 13px 'Noto Sans KR';color:#ffe08a;text-shadow:0 1px 2px #000}
#bottom{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:grid;justify-items:center;gap:7px}
#hpWrap{width:400px;max-width:44vw}
#hpBar{height:16px}
#hpBar i{background:linear-gradient(#7af0a2,#2fae5c)}
#hpTxt{position:absolute;inset:0;display:grid;place-items:center;font:700 13px 'Rajdhani';text-shadow:0 1px 2px #000}
#skills{display:flex;gap:7px}
.sk{position:relative;width:56px;height:56px;border-radius:10px;background:#141a2c;border:2px solid #3a4566;display:grid;place-items:center;color:#d8e2ff;overflow:hidden}
.sk svg{width:28px;height:28px}
.sk .k{position:absolute;left:4px;top:2px;font:700 12px 'Rajdhani';color:#fff;text-shadow:0 1px 2px #000}
.sk .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0);display:grid;place-items:center;font:700 18px 'Rajdhani';color:#fff;text-shadow:0 1px 2px #000}
.sk.ready{border-color:#8fb3ff}
.sk.on{border-color:#ffc94a;box-shadow:0 0 14px rgba(255,201,74,.6)}
.sk .nmk{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font:600 10px 'Noto Sans KR';color:#aab6d6;background:rgba(0,0,0,.45)}
#gauge{position:absolute;inset:auto 0 0 0;height:var(--g,0%);background:linear-gradient(rgba(255,201,74,0),rgba(255,201,74,.38))}
#ctrlHint{font-size:12px;color:#9aa6c6;text-shadow:0 1px 2px #000}
#counterTip{position:absolute;left:50%;top:62%;transform:translateX(-50%);font:400 26px 'Black Han Sans';color:#4fb6ff;text-shadow:0 0 12px rgba(79,182,255,.9),0 2px 3px #000;opacity:0;transition:opacity .1s}
#counterTip.show{opacity:1}
#vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(0,0,0,.6)}
#vign.hurt{box-shadow:inset 0 0 160px rgba(220,30,20,.7)}
#vign.low{animation:lowhp .75s infinite}
@keyframes lowhp{0%,100%{box-shadow:inset 0 0 120px rgba(200,20,10,.35)}50%{box-shadow:inset 0 0 210px rgba(220,30,20,.75)}}
#streak{position:absolute;left:50%;top:34%;transform:translateX(-50%);font:400 32px 'Black Han Sans';color:#ffc94a;text-shadow:0 0 14px rgba(255,201,74,.6),0 2px 3px #000;opacity:0;white-space:nowrap}
#streak.pop{animation:pop 1.15s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(1.7)}12%{opacity:1;transform:translateX(-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-16px)}}
#lvRow{width:400px;max-width:44vw;display:flex;align-items:center;gap:8px;font-size:12px;color:#cdd6ee;text-shadow:0 1px 2px #000}
#lvN{font:700 16px 'Rajdhani';color:#ffc94a}
#xpBar{flex:1;height:7px}
#xpBar i{background:linear-gradient(90deg,#8fb3ff,#4f7fe0)}
#spN{color:#ffc94a;white-space:nowrap}
#ilvN{white-space:nowrap}
.loot{position:absolute;transform:translate(-50%,-100%);font:700 12px 'Noto Sans KR';text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.95);white-space:nowrap}
#feed div.g0{color:#d8dce6}#feed div.g1{color:#8ad35b}#feed div.g2{color:#4fa9ff}#feed div.g3{color:#c27bff}#feed div.g4{color:#ffa63a}#feed div.g5{color:#ff6a3a}
.gear{width:min(1100px,100%)}
.ghead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 26px}
.ghead h2{margin:2px 0 0}
.gil span,.mini span{display:block;font-size:12px;color:#9aa6c6}
.gil b{font:700 32px/1 'Rajdhani';color:#ffc94a}
.mini b{font:700 22px/1 'Rajdhani'}
.gxp{width:210px}
.gxp .bar,.xpb{height:8px;margin-top:4px}
.gxp .bar i,.xpb i{background:linear-gradient(90deg,#8fb3ff,#4f7fe0)}
.sub{font-size:12px;color:#9aa6c6}
.tabs{display:flex;gap:6px;margin:14px 0 10px}
.tabs button{min-height:42px;padding:6px 18px;border-radius:9px;border:1px solid #3a4566;background:#151c30;cursor:pointer;font-weight:700}
.tabs button.on{background:#e8eeff;color:#101528}
.gbody{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px}
.slots{display:grid;gap:8px;align-content:start}
.slot{display:grid;gap:4px}
.slbl{font:700 12px 'Noto Sans KR';color:#9aa6c6}
.card{display:block;width:100%;padding:8px 11px;border-radius:10px;background:rgba(20,26,44,.94);border:1px solid #2c3656;border-left:4px solid var(--gc);font-size:13px;line-height:1.45;cursor:pointer;text-align:left;color:inherit}
.card .nm2{display:block;font-weight:700;color:var(--gc)}
.card .ln,.detail .ln{display:block}
.card .opt{color:#cfe0ff}
.spx{color:#ffa63a}
.card.sel{box-shadow:0 0 0 2px #fff}
.card:focus-visible,.tb:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.pri.sm{font:700 14px 'Noto Sans KR'}
.btns.sm{margin-top:8px}
.bagwrap{display:grid;gap:8px;align-content:start}
.bagh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;max-height:300px;overflow:auto;padding-right:4px}
.detail{padding:10px 12px;border-radius:10px;background:rgba(8,12,24,.92);border:1px solid #2c3656;font-size:13px;line-height:1.55}
.up{color:#5fe08a}.down{color:#ff6a5a}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font-size:13px;padding:10px 12px;border-radius:10px;background:rgba(8,12,24,.92);border:1px solid #2c3656}
.statgrid b{font:700 15px 'Rajdhani';float:right}
.trihead{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.trihead b{font:700 20px 'Rajdhani';color:#ffc94a}
.tri{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:130px repeat(3,minmax(0,1fr));gap:8px;padding:8px;border-radius:10px;background:rgba(20,26,44,.92);border:1px solid #2c3656}
.tname{display:grid;align-content:center;gap:4px}
.tname kbd{justify-self:start;padding:1px 7px;border-radius:5px;background:#e8eeff;color:#101528;font:700 13px 'Rajdhani'}
.tcol{display:grid;gap:4px;align-content:start}
.tcol small{color:#9aa6c6;font-size:11px}
.tb{min-height:44px;padding:6px 8px;border-radius:8px;border:1px solid #3a4566;background:#111729;text-align:left;cursor:pointer;font-size:12px;line-height:1.35;color:#cdd6ee}
.tb b{display:block;font-size:13px;color:#fff}
.tb.on{border-color:#ffc94a;background:rgba(255,201,74,.16)}
.tb:disabled{opacity:.38;cursor:not-allowed}
.charbox{display:grid;gap:10px;margin-top:14px}
.cinfo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cinfo>div{flex:1;min-width:200px}
.cinfo b{display:block;font-size:16px}
.cinfo span{font-size:13px;color:#cdd6ee}
.av.big{width:52px;height:52px;border-radius:10px;background:#0a0d14 var(--face) no-repeat;background-size:200% 200%}
.diffs{display:flex;gap:6px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.actb{flex:1 1 180px;min-height:54px;padding:8px 14px;border-radius:12px;border:1px solid #3a4566;background:rgba(21,28,48,.85);cursor:pointer;font:700 15px 'Noto Sans KR';color:inherit;text-align:left}
.actb span{display:block;font:600 11.5px 'Noto Sans KR';color:#9aa6c6;margin-top:2px}
.actb.on{border-color:#ffc94a;background:rgba(255,201,74,.16);box-shadow:0 0 0 1px rgba(255,201,74,.3) inset}
.actb.soon{opacity:.45;cursor:default}
.dbtn{min-height:48px;padding:6px 14px;border-radius:10px;border:1px solid #3a4566;background:#151c30;cursor:pointer;font:700 15px 'Noto Sans KR';color:inherit;text-align:left}
.dbtn small{display:block;font:600 11px 'Noto Sans KR';color:#9aa6c6}
.dbtn.on{border-color:#ffc94a;background:rgba(255,201,74,.14)}
.dbtn:disabled{opacity:.45;cursor:not-allowed}
.warn{color:#ffb35a;font-size:13px;margin:0}
.rew{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(20,26,44,.86);border:1px solid #2c3656;font-size:14px;line-height:1.7}
.rew i{font-style:normal;margin-right:10px}
@media (max-width:900px){.gbody{grid-template-columns:1fr}.trow{grid-template-columns:1fr}}
#heatWrap{width:260px;display:grid;gap:2px;justify-items:center}
#heatWrap[hidden]{display:none}
#heatWrap .bar{width:100%;height:9px}
#heatWrap .bar i{background:linear-gradient(90deg,#ffd24a,#ff4b3a)}
#heatWrap span{font:600 12px 'Noto Sans KR';color:#ffd9a8;text-shadow:0 1px 2px #000}
#ov{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 40%,rgba(14,22,46,.6),rgba(5,8,18,.93));z-index:5;padding:20px;overflow:auto}
#ov[hidden]{display:none}
#ov.art{background:linear-gradient(90deg,rgba(5,8,18,.95) 0%,rgba(5,8,18,.82) 42%,rgba(5,8,18,.35) 100%),var(--art,none) center/cover no-repeat,#0b1020}
.panel{width:min(880px,100%);text-align:left}
.panel .kick{font:700 15px 'Noto Sans KR';color:#8fb3ff}
.panel h1{margin:4px 0 0;font:400 clamp(38px,5.6vw,66px)/1.02 'Black Han Sans';color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.7);text-wrap:balance}
.panel h1 span{color:#ff6a5a}
.panel .logo{font:900 clamp(30px,4.4vw,54px)/1 Rajdhani,'Black Han Sans',sans-serif;letter-spacing:.14em;color:#fff;text-shadow:0 0 22px rgba(255,90,60,.35),0 4px 18px rgba(0,0,0,.7);margin-bottom:6px}
.panel .logo i{font-style:normal;color:#ff5a3a}
.panel .logo small{display:block;margin-top:6px;font:700 13px 'Noto Sans KR';letter-spacing:.32em;color:#9aa6c6}
.panel h2{margin:10px 0 0;font:400 clamp(20px,2.4vw,28px)/1.2 'Black Han Sans';color:#ffd9a8}
.panel p{color:#cdd6ee;max-width:66ch;margin:12px 0 0}
.brief{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-top:16px}
.box{padding:12px 14px;border-radius:12px;background:rgba(20,26,44,.86);border:1px solid #2c3656}
.box h3{margin:0 0 8px;font:700 14px 'Noto Sans KR';color:#ffd24a}
.box ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;color:#dfe6f8}
.box ol b{color:#fff}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}
.keys kbd{display:inline-block;min-width:26px;padding:1px 6px;margin-right:6px;border-radius:5px;background:#e8eeff;color:#101528;font:700 13px 'Rajdhani';text-align:center}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.btn{min-height:50px;padding:10px 24px;border-radius:12px;border:1px solid #3a4566;background:#151c30;font:700 16px 'Noto Sans KR';cursor:pointer}
.btn.pri{background:linear-gradient(#ff7a62,#c8321f);border-color:#ff9f8f;font:400 22px 'Black Han Sans';color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}
.stats div{padding:10px 12px;border-radius:10px;background:rgba(20,26,44,.86);border:1px solid #2c3656}
.stats span{display:block;font-size:13px;color:#9aa6c6}
.stats b{font:700 24px/1.1 'Rajdhani'}
.rank{display:flex;gap:16px;align-items:center;margin-top:10px}
.rank i{font:400 84px/1 'Black Han Sans';font-style:normal;color:#ffc94a;text-shadow:0 0 24px rgba(255,201,74,.5)}
#load{font:600 14px 'Noto Sans KR';color:#9aa6c6}
.note{font-size:13px;color:#8f9bbb}
.ehp.ally i{background:#5fe08a}
.sq b em{font-style:normal;font-size:11px;margin-left:4px}
#wv{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:6px 18px;border-radius:999px;background:rgba(5,8,18,.78);border:1px solid rgba(143,179,255,.35);font:700 15px 'Noto Sans KR';color:#eef3ff;text-shadow:0 1px 2px #000;white-space:nowrap}
#wv[hidden]{display:none}
